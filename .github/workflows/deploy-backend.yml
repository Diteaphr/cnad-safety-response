name: Deploy Backend

on:
  push:
    branches: [main]
    paths: ['backend/**']
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy safety-response-api \
            --source ./backend \
            --region asia-east1 \
            --project cnad-safety-response \
            --update-env-vars "USE_GCP=${{ secrets.USE_GCP }},GCP_PROJECT_ID=${{ secrets.GCP_PROJECT_ID }},PUBSUB_NOTIFICATION_TOPIC=${{ secrets.PUBSUB_NOTIFICATION_TOPIC }},SERVICE_URL=${{ secrets.SERVICE_URL }},PUBSUB_SA_EMAIL=${{ secrets.PUBSUB_SA_EMAIL }},FIREBASE_ENABLED=${{ secrets.FIREBASE_ENABLED }},TWILIO_ACCOUNT_SID=${{ secrets.TWILIO_ACCOUNT_SID }},TWILIO_AUTH_TOKEN=${{ secrets.TWILIO_AUTH_TOKEN }},TWILIO_FROM_NUMBER=${{ secrets.TWILIO_FROM_NUMBER }}" \
            --quiet
