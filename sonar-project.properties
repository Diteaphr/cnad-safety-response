sonar.projectKey=cnad-safety-response
sonar.projectName=CNAD Safety Response
sonar.host.url=http://host.docker.internal:9000

# Production source (do NOT include test directories here)
sonar.sources=frontend/src,backend/app

# Test directories — separate from sources so SonarQube counts them as tests
sonar.tests=backend/tests,frontend/src

# Test file patterns (Python test_*.py, TS *.test.ts(x))
sonar.test.inclusions=**/test_*.py,**/*.test.ts,**/*.test.tsx

# Exclude tests, build artifacts, and migrations from source analysis
sonar.exclusions=**/node_modules/**,**/dist/**,**/alembic/**,**/*.test.ts,**/*.test.tsx,**/tests/**,**/seeding/**

# Coverage: backend only (frontend still scanned for issues, but not in coverage %)
sonar.coverage.exclusions=frontend/**

# Python: coverage + test execution reports (generate before scan)
sonar.python.coverage.reportPaths=backend/coverage.xml
sonar.python.xunit.reportPath=backend/junit.xml

sonar.sourceEncoding=UTF-8
